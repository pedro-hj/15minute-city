name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install Python and project
        run: |
          uv python install
          uv sync --locked --all-groups

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -m "not benchmark"

      - name: Verify offline migration SQL
        env:
          DATABASE_URL: postgresql+psycopg://user:pass@localhost/db
        run: uv run alembic upgrade head --sql > /tmp/migration.sql
